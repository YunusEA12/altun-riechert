<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" width="520" height="96" role="img" aria-label="Altun &amp; Riechert – Digital für Betriebe · Region Stuttgart">
  <!-- Kachel -->
  <rect x="0" y="0" width="96" height="96" fill="#123B40"/>
  <text x="48" y="58" text-anchor="middle" font-family="Archivo, 'Arial Narrow', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-1">A<tspan fill="#E39A2D">&amp;</tspan>R</text>
  <!-- Signal-Linie unter dem Kürzel -->
  <rect x="25" y="72" width="14" height="4" fill="#E39A2D"/>
  <rect x="42" y="72" width="14" height="4" fill="#E39A2D" fill-opacity=".65"/>
  <rect x="59" y="72" width="12" height="4" fill="#E39A2D" fill-opacity=".35"/>
  <!-- Wortmarke -->
  <text x="120" y="48" font-family="Archivo, 'Arial Narrow', Arial, sans-serif" font-size="34" font-weight="780" fill="#123B40">Altun <tspan fill="#E39A2D">&amp;</tspan> Riechert</text>
  <text x="121" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.2" fill="#4E6A6D">DIGITAL FÜR BETRIEBE · REGION STUTTGART</text>
</svg>
